[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wander"
version = "0.1.0"
description = "Wander: a travel muse for people who do not know where to go, painted with Muse Image."
requires-python = ">=3.10"
dependencies = ["openai>=1.50", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
